# conf for [Air](https://github.com/cosmtrek/air) in TOML format

root = "."
tmp_dir = "tmp"

[build]
full_bin = "godotenv -f .env ./fider"
cmd = "make build-server"
log = "server-errors.log"
include_ext = ["go", "tpl", "tmpl", "html", "env", "json", "js", "css", "sql"]
exclude_dir = ["public", "dist", "tmp", "vendor", "node_modules", "data", "tests", "output", "scripts"]
exclude_file = ["app/pkg/bus/dispatch_gen.go"]
exclude_regex = ["_test\\.go$"]
delay = 1000

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
app = "white"
